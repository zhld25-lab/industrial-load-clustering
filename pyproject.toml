[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-load-clustering"
version = "1.0.0"
description = "Reproducible prototype of patent CN119622383A for industrial park load-pattern analysis"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
industrial-load-demo = "industrial_load.cli:main"
industrial-load-build-db = "industrial_load.database:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=industrial_load --cov-report=term-missing --cov-fail-under=90"
